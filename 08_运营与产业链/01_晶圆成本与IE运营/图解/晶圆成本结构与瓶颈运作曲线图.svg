<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Title -->
  <text x="480" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">300mm 晶圆厂成本经济账与运作曲线（Operating Curve / Little's Law）</text>
  <text x="480" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">Fab Cost Structure (CapEx Depreciation Dominance) &amp; Cycle Time vs Bottleneck Utilization</text>

  <!-- Left: Cost Structure & Good Die Cost Formula -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="435" height="375" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="217" y="24" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle">先进制程晶圆厂 CapEx 与单片成本结构</text>

    <!-- Stacked horizontal bar chart for CapEx -->
    <g transform="translate(20, 45)">
      <text x="0" y="12" fill="#cbd5e1" font-size="10" font-weight="bold">1. 百亿美金级先进 Fab 初期投资构成 (CapEx):</text>
      <rect x="0" y="22" width="295" height="28" fill="#0284c7" />
      <text x="147" y="40" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">制造与量测设备 (~75%)</text>
      <rect x="295" y="22" width="100" height="28" fill="#475569" />
      <text x="345" y="40" fill="#e2e8f0" font-size="9" text-anchor="middle">洁净土建 (~25%)</text>
    </g>

    <!-- Stacked bar for Wafer Cost -->
    <g transform="translate(20, 110)">
      <text x="0" y="12" fill="#cbd5e1" font-size="10" font-weight="bold">2. 量产期单片晶圆制造成本拆解 (固定折旧刚性极大):</text>
      <rect x="0" y="22" width="220" height="28" fill="#ea580c" />
      <text x="110" y="40" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">设备与厂房折旧 (~55~65%)</text>
      <rect x="220" y="22" width="100" height="28" fill="#10b981" />
      <text x="270" y="40" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">耗材硅片 (~25%)</text>
      <rect x="320" y="22" width="75" height="28" fill="#8b5cf6" />
      <text x="357" y="40" fill="#ffffff" font-size="9" text-anchor="middle">人工水电 (~15%)</text>
    </g>

    <!-- Good Die Formula & Yield Lever -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="395" height="175" rx="6" fill="#0f172a" stroke="#475569" />
      <text x="15" y="24" fill="#38bdf8" font-size="11" font-weight="bold">3. 单颗好芯片成本核心杠杆公式：</text>
      <text x="197" y="54" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="middle">Cost per Good Die = Wafer Cost / (Gross DPW × Yield)</text>
      <line x1="15" y1="68" x2="380" y2="68" stroke="#334155" />
      <text x="15" y="88" fill="#cbd5e1" font-size="9">• 稼动率死线：折旧占总成本一半以上，稼动率跌破 ~70% 毛利大幅缩水</text>
      <text x="15" y="108" fill="#cbd5e1" font-size="9">• 良率杠杆：若 CP 良率从 40% 提至 85%，单颗裸片成本直接腰斩一半</text>
      <text x="15" y="128" fill="#34d399" font-size="9">• Chiplet 拆核原理：大芯片受面积平方级边缘亏损与泊松良率双击，</text>
      <text x="15" y="144" fill="#34d399" font-size="9">  拆分成小芯粒通过 CoWoS 互连可把可售总芯粒数大幅拉升 50%+</text>
    </g>
  </g>

  <!-- Right: Fab Operating Curve (Kingman / Little's Law) -->
  <g transform="translate(490, 75)">
    <rect x="0" y="0" width="440" height="375" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="220" y="24" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">晶圆厂运作曲线：瓶颈机台稼动率 vs 生产周期 X-Factor</text>

    <!-- Graph Axes -->
    <line x1="65" y1="245" x2="405" y2="245" stroke="#64748b" stroke-width="2" />
    <line x1="65" y1="245" x2="65" y2="55" stroke="#64748b" stroke-width="2" />
    <text x="235" y="268" fill="#cbd5e1" font-size="10" text-anchor="middle">瓶颈机台（如 EUV 光刻区）稼动率 Utilization (%)</text>
    <text x="22" y="150" fill="#cbd5e1" font-size="10" text-anchor="middle" transform="rotate(-90 22,150)">X-Factor (Cycle Time 倍数)</text>

    <!-- X ticks -->
    <text x="115" y="258" fill="#94a3b8" font-size="8" text-anchor="middle">50%</text>
    <text x="215" y="258" fill="#94a3b8" font-size="8" text-anchor="middle">75%</text>
    <text x="305" y="258" fill="#facc15" font-size="8" font-weight="bold" text-anchor="middle">85%</text>
    <text x="365" y="258" fill="#f87171" font-size="8" font-weight="bold" text-anchor="middle">95%</text>

    <!-- Y ticks -->
    <text x="58" y="235" fill="#94a3b8" font-size="8" text-anchor="end">1.5x</text>
    <text x="58" y="185" fill="#94a3b8" font-size="8" text-anchor="end">2.5x</text>
    <text x="58" y="95" fill="#f87171" font-size="8" text-anchor="end">6.0x+</text>

    <!-- Sweet Spot Vertical Band -->
    <rect x="275" y="60" width="45" height="185" fill="#10b981" opacity="0.18" />
    <text x="297" y="75" fill="#34d399" font-size="8" font-weight="bold" text-anchor="middle">甜点区</text>

    <!-- Curve: Flat then exponential -->
    <path d="M 75,232 L 160,226 Q 260,220 305,180 Q 345,140 365,65" fill="none" stroke="#38bdf8" stroke-width="3" />
    <!-- Lower variability curve -->
    <path d="M 75,238 L 160,235 Q 280,232 325,205 Q 360,175 380,85" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" />

    <text x="240" y="150" fill="#38bdf8" font-size="9">高波动产线 (宕机/急件多)</text>
    <text x="275" y="218" fill="#34d399" font-size="9">低波动精益 Fab</text>

    <!-- Bottom Law Box -->
    <rect x="20" y="282" width="400" height="78" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="302" fill="#facc15" font-size="10" font-weight="bold">利特尔法则 &amp; 金曼排队公式：Cycle Time = WIP / Throughput</text>
    <text x="32" y="320" fill="#cbd5e1" font-size="9">• 稼动率一旦逼近 90%+，排队等待时间呈 u/(1-u) 指数级爆炸，周期翻倍</text>
    <text x="32" y="336" fill="#cbd5e1" font-size="9">• 越早减薄在制 WIP、缩短换光罩时间、减少突发宕机，越能压低 X-Factor 至 2.0 左右</text>
  </g>
</svg>
