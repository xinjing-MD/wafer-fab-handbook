<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <radialGradient id="plasmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Title -->
  <text x="480" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">等离子体刻蚀反应机理（ICP/CCP）与湿法 RCA 清洗技术</text>
  <text x="480" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Plasma Dry Etch Mechanisms (Chemical + Physical) &amp; Standard RCA Cleaning</text>

  <!-- Left: ICP Plasma Etch Chamber -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="420" height="375" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="210" y="24" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">ICP 刻蚀腔体结构与微观各向异性轰击</text>

    <!-- ICP Coils at top -->
    <path d="M 120,45 Q 140,35 160,45 Q 180,55 200,45 Q 220,35 240,45 Q 260,55 280,45" fill="none" stroke="#fbbf24" stroke-width="4" />
    <text x="320" y="48" fill="#fef08a" font-size="9">顶置射频线圈 (Source RF: 产生高密等离子体)</text>

    <!-- Gas Showerhead -->
    <rect x="110" y="65" width="200" height="10" rx="3" fill="#64748b" />
    <text x="210" y="73" fill="#cbd5e1" font-size="8" text-anchor="middle">刻蚀气体喷淋头 (CF4, Cl2, HBr, O2)</text>

    <!-- Plasma Glow Zone -->
    <ellipse cx="210" cy="140" rx="140" ry="55" fill="url(#plasmaGlow)" />
    <text x="210" y="135" fill="#f3e8ff" font-size="12" font-weight="bold" text-anchor="middle">高密度等离子体辉光区</text>
    <text x="210" y="152" fill="#e9d5ff" font-size="9" text-anchor="middle">中性游离基 (化学腐蚀) + 带正电高能离子 (垂直轰击)</text>

    <!-- Wafer on ESC -->
    <rect x="100" y="210" width="220" height="12" rx="3" fill="#0284c7" />
    <text x="210" y="220" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">300mm 晶圆 (静电吸附在 ESC 上)</text>
    <rect x="90" y="222" width="240" height="14" rx="2" fill="#334155" />
    <text x="210" y="233" fill="#94a3b8" font-size="8" text-anchor="middle">ESC 静电吸盘 (带多区 He 背冷与下置 Bias RF 控制离子能量)</text>

    <!-- Microscopic Trench Diagram -->
    <g transform="translate(60, 255)">
      <rect x="0" y="0" width="300" height="105" rx="6" fill="#0f172a" stroke="#475569" />
      <text x="15" y="18" fill="#38bdf8" font-size="10" font-weight="bold">微观侧壁钝化机制 (Sidewall Passivation):</text>
      
      <!-- Trench profile -->
      <path d="M 40,40 L 70,40 L 70,85 L 110,85 L 110,40 L 140,40" fill="none" stroke="#94a3b8" stroke-width="3" />
      <!-- Photoresist mask -->
      <rect x="40" y="28" width="30" height="12" fill="#f59e0b" />
      <rect x="110" y="28" width="30" height="12" fill="#f59e0b" />
      <!-- Sidewall polymer -->
      <line x1="72" y1="42" x2="72" y2="83" stroke="#ef4444" stroke-width="2" />
      <line x1="108" y1="42" x2="108" y2="83" stroke="#ef4444" stroke-width="2" />

      <!-- Annotations -->
      <text x="160" y="42" fill="#ef4444" font-size="9">■ 聚合物侧壁保护层 (阻止横向钻蚀)</text>
      <text x="160" y="60" fill="#38bdf8" font-size="9">↓ 离子沿电场垂向轰击 (打碎底部聚合物)</text>
      <text x="160" y="78" fill="#10b981" font-size="9">⚡ 实现极高垂直度与选择比 (Anisotropic)</text>
    </g>
  </g>

  <!-- Right: Wet RCA Clean Pipeline -->
  <g transform="translate(490, 75)">
    <rect x="0" y="0" width="430" height="375" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="215" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">工业级 RCA 湿法清洗工序与去污机理</text>

    <!-- Clean Steps -->
    <g transform="translate(20, 45)">
      <!-- Step 1: SPM -->
      <rect x="0" y="0" width="390" height="65" rx="6" fill="#0f172a" stroke="#ef4444" />
      <text x="15" y="20" fill="#f87171" font-size="11" font-weight="bold">1. SPM 食人鱼洗液 (H2SO4 : H2O2 @ 120°C)</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9">• 去除对象：重度残留光刻胶 (Photoresist) 与大分子有机油污</text>
      <text x="15" y="52" fill="#94a3b8" font-size="8">• 机理：超强过氧化氢浓硫酸脱水炭化与完全氧化为 CO2 气体</text>

      <!-- Step 2: DHF -->
      <rect x="0" y="75" width="390" height="65" rx="6" fill="#0f172a" stroke="#eab308" />
      <text x="15" y="95" fill="#facc15" font-size="11" font-weight="bold">2. DHF 稀氢氟酸清洗 (HF : H2O 1:100 @ 室温)</text>
      <text x="15" y="113" fill="#cbd5e1" font-size="9">• 去除对象：空气中自发形成的自然氧化层 (Native Oxide SiO2)</text>
      <text x="15" y="127" fill="#94a3b8" font-size="8">• 机理：反应生成易溶氟硅酸 (H2SiF6)，露出纯净憎水单晶硅表面</text>

      <!-- Step 3: SC-1 -->
      <rect x="0" y="150" width="390" height="65" rx="6" fill="#0f172a" stroke="#10b981" />
      <text x="15" y="170" fill="#34d399" font-size="11" font-weight="bold">3. SC-1 / APM 清洗 (NH4OH : H2O2 : H2O @ 70°C)</text>
      <text x="15" y="188" fill="#cbd5e1" font-size="9">• 去除对象：纳米级颗粒物 (Particles) 与微量有机物</text>
      <text x="15" y="202" fill="#94a3b8" font-size="8">• 机理：微刻蚀表面托起颗粒，双同带负 Zeta 电位形成静电排斥 + 兆声波剥离</text>

      <!-- Step 4: SC-2 & IPA Dry -->
      <rect x="0" y="225" width="390" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" />
      <text x="15" y="245" fill="#38bdf8" font-size="11" font-weight="bold">4. SC-2 / HPM 清洗与 Marangoni 干燥</text>
      <text x="15" y="263" fill="#cbd5e1" font-size="9">• 配方：HCl : H2O2 : H2O @ 70°C 络合清除过渡金属离子 (Fe, Cu, Ni)</text>
      <text x="15" y="278" fill="#cbd5e1" font-size="9">• 干燥方式：IPA (异丙醇) 马兰戈尼表面张力梯度干燥，防止形成 Watermark</text>
      <text x="15" y="295" fill="#f43f5e" font-size="8">★ 极细线宽 GAA 采用超临界 CO2 (scCO2) 干燥防毛细拉力倒塌</text>
    </g>
  </g>
</svg>
