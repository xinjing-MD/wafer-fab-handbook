<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="gradCrucible" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gradMelt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="gradIngot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="gradWafer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="36" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">CZ 单晶硅棒生长与 300mm 晶圆加工全流程架构</text>
  <text x="450" y="58" fill="#94a3b8" font-size="12" text-anchor="middle">Czochralski (CZ) Crystal Ingot Growth &amp; 300mm Wafering Pipeline</text>

  <!-- Left: CZ Crystal Puller Furnace -->
  <g transform="translate(60, 90)">
    <!-- Furnace Shell -->
    <rect x="0" y="0" width="260" height="340" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="130" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">CZ 单晶提拉炉 (1420°C)</text>

    <!-- Crucible -->
    <path d="M 40,240 Q 40,310 130,310 Q 220,310 220,240 Z" fill="url(#gradCrucible)" stroke="#64748b" stroke-width="2" />
    <!-- Molten Silicon -->
    <path d="M 45,250 Q 45,305 130,305 Q 215,305 215,250 Z" fill="url(#gradMelt)" />
    <text x="130" y="285" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">熔融态多晶硅液</text>

    <!-- Seed Crystal & Pull Shaft -->
    <rect x="126" y="40" width="8" height="60" fill="#94a3b8" />
    <polygon points="122,100 138,100 130,115" fill="#e2e8f0" />
    <text x="175" y="80" fill="#cbd5e1" font-size="10">籽晶提拉 (Pulling)</text>
    <path d="M 115,70 A 15,15 0 0,1 145,70" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Ingot Body -->
    <path d="M 110,120 Q 130,115 150,120 L 165,150 L 165,245 L 95,245 L 95,150 Z" fill="url(#gradIngot)" stroke="#475569" />
    <text x="130" y="190" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">单晶硅棒</text>
    <text x="130" y="206" fill="#1e293b" font-size="10" text-anchor="middle">(&lt;100&gt; 晶向)</text>

    <!-- Heaters -->
    <rect x="25" y="235" width="10" height="70" rx="3" fill="#ef4444" opacity="0.8" />
    <rect x="225" y="235" width="10" height="70" rx="3" fill="#ef4444" opacity="0.8" />
    <text x="25" y="325" fill="#f87171" font-size="9">石墨加热器</text>
  </g>

  <!-- Flow Arrows -->
  <g fill="#38bdf8" opacity="0.9">
    <path d="M 335,260 L 375,260 L 375,255 L 390,265 L 375,275 L 375,270 L 335,270 Z" />
  </g>

  <!-- Right: Wafering Process Steps (Flow Nodes) -->
  <g transform="translate(400, 85)">
    <!-- Step 1 -->
    <rect x="0" y="10" width="210" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="25" cy="40" r="14" fill="#3b82f6" />
    <text x="25" y="45" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <text x="50" y="34" fill="#f8fafc" font-size="12" font-weight="bold">滚圆整形与打扁平/开缺</text>
    <text x="50" y="52" fill="#94a3b8" font-size="10">截断头部 / 倒角滚磨 / V-Notch</text>

    <!-- Connector -->
    <line x1="105" y1="70" x2="105" y2="85" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Step 2 -->
    <rect x="0" y="85" width="210" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="25" cy="115" r="14" fill="#3b82f6" />
    <text x="25" y="120" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <text x="50" y="109" fill="#f8fafc" font-size="12" font-weight="bold">金刚石线切割 (Wire Saw)</text>
    <text x="50" y="127" fill="#94a3b8" font-size="10">数百片同时切片 / 厚度 ~775μm</text>

    <!-- Connector -->
    <line x1="105" y1="145" x2="105" y2="160" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Step 3 -->
    <rect x="0" y="160" width="210" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="25" cy="190" r="14" fill="#3b82f6" />
    <text x="25" y="195" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    <text x="50" y="184" fill="#f8fafc" font-size="12" font-weight="bold">双面研磨与化学腐蚀</text>
    <text x="50" y="202" fill="#94a3b8" font-size="10">去机械损伤层 / 酸蚀 (HF/HNO3)</text>

    <!-- Connector -->
    <line x1="105" y1="220" x2="105" y2="235" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Step 4 -->
    <rect x="0" y="235" width="210" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="25" cy="265" r="14" fill="#10b981" />
    <text x="25" y="270" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4</text>
    <text x="50" y="259" fill="#f8fafc" font-size="12" font-weight="bold">CMP 超精密表面抛光</text>
    <text x="50" y="277" fill="#94a3b8" font-size="10">粗抛+精抛 / 表面粗糙度 Ra&lt;0.1nm</text>

    <!-- Connector -->
    <line x1="105" y1="295" x2="105" y2="310" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Step 5 -->
    <rect x="0" y="310" width="210" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="25" cy="340" r="14" fill="#10b981" />
    <text x="25" y="345" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">5</text>
    <text x="50" y="334" fill="#f8fafc" font-size="12" font-weight="bold">外延生长 Epi / 激光打码</text>
    <text x="50" y="352" fill="#94a3b8" font-size="10">消除表层 COP 缺陷 / T7 身份追溯</text>
  </g>

  <!-- Far Right: 300mm Wafer Showcase -->
  <g transform="translate(660, 150)">
    <!-- Wafer Disc -->
    <circle cx="100" cy="100" r="90" fill="url(#gradWafer)" stroke="#38bdf8" stroke-width="3" />
    <!-- V-Notch -->
    <path d="M 97,10 L 100,16 L 103,10 Z" fill="#0f172a" />
    <text x="100" y="95" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">300 mm</text>
    <text x="100" y="115" fill="#bae6fd" font-size="11" text-anchor="middle">厚度 775 ± 25 μm</text>
    <text x="100" y="132" fill="#e0f2fe" font-size="9" text-anchor="middle">Notch 缺口定位</text>

    <!-- Spec box -->
    <rect x="0" y="215" width="200" height="75" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="10" y="235" fill="#38bdf8" font-size="11" font-weight="bold">黄金指标规格 (SEMI M1)</text>
    <text x="10" y="252" fill="#94a3b8" font-size="10">• 纯度: 9N - 11N (99.9999999%)</text>
    <text x="10" y="268" fill="#94a3b8" font-size="10">• 边缘排除区 (Edge Exclusion): 3mm</text>
    <text x="10" y="283" fill="#94a3b8" font-size="10">• 平坦度: SFQR &lt; 20nm</text>
  </g>
</svg>
