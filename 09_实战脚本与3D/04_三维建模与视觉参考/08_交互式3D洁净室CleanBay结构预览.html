<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12 寸晶圆厂 Clean Bay 与 Cluster Tool 交互式 3D 结构预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b1120; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
    #hud {
      position: fixed; top: 16px; left: 16px; width: 340px; padding: 16px;
      background: rgba(15, 23, 42, 0.88); border: 1px solid #334155; border-radius: 10px;
      backdrop-filter: blur(8px); z-index: 10; font-size: 13px; line-height: 1.55;
    }
    #hud h1 { font-size: 15px; color: #38bdf8; margin-bottom: 6px; }
    #hud p { color: #94a3b8; font-size: 12px; margin-bottom: 10px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    button {
      background: #1e293b; color: #f8fafc; border: 1px solid #475569;
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    button:hover { border-color: #38bdf8; color: #38bdf8; }
    button.active { background: #b45309; border-color: #f59e0b; color: #fef08a; }
    .specs { border-top: 1px solid #1e293b; padding-top: 8px; font-size: 11.5px; color: #cbd5e1; }
    .specs li { list-style: none; margin: 3px 0; }
    .specs span { color: #34d399; font-weight: 600; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>300mm Fab Clean Bay 交互式三维结构</h1>
    <p>左键拖拽旋转 · 滚轮缩放 · 右键平移（1:1 公制工程标高）</p>
    <div class="btn-row">
      <button id="btnAmber">切换 589nm 光刻黄光区</button>
      <button id="btnOht">暂停/恢复 OHT 天车巡航</button>
      <button id="btnReset">重置视角</button>
    </div>
    <ul class="specs">
      <li>• 架高地板单元：<span>600 × 600 mm</span></li>
      <li>• OHT 天轨标高：<span>Z = 3.50 m</span></li>
      <li>• Load Port 基准：<span>Z = 900 mm (SEMI E15.1)</span></li>
      <li>• FOUP 标准晶圆：<span>25 片 × 10 mm Pitch</span></li>
      <li>• 机台集群构型：<span>EFEM → LoadLock → VTM → 4×PM</span></li>
    </ul>
  </div>
  <canvas id="scene"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.5, 3.2, 5.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.3, 0);
    controls.enableDamping = true;

    // Lighting (5000K white vs 589nm litho amber toggle)
    const ambient = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(4, 7, 5);
    scene.add(dirLight);

    // 1. 600x600mm Raised Perforated Floor Grid (6m x 6m)
    const floorGroup = new THREE.Group();
    const tileGeo = new THREE.BoxGeometry(0.59, 0.04, 0.59);
    const tileMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.45, metalness: 0.55 });
    for (let x = -5; x <= 4; x++) {
      for (let z = -5; z <= 4; z++) {
        const t = new THREE.Mesh(tileGeo, tileMat);
        t.position.set((x + 0.5) * 0.6, -0.02, (z + 0.5) * 0.6);
        floorGroup.add(t);
      }
    }
    scene.add(floorGroup);

    // 2. Bulkhead Wall separating Clean Bay (z > 0) and Service Chase (z < 0)
    const bulkhead = new THREE.Mesh(
      new THREE.BoxGeometry(6.0, 4.2, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, transparent: true, opacity: 0.45 })
    );
    bulkhead.position.set(0, 2.1, -0.45);
    scene.add(bulkhead);

    // 3. Load Port (Z = 0.900m) + 25-slot FOUP
    const lp = new THREE.Mesh(
      new THREE.BoxGeometry(0.45, 0.9, 0.50),
      new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.4, roughness: 0.4 })
    );
    lp.position.set(-0.35, 0.45, 0.35);
    scene.add(lp);

    const foup = new THREE.Mesh(
      new THREE.BoxGeometry(0.36, 0.33, 0.35),
      new THREE.MeshStandardMaterial({ color: 0xd97706, transparent: true, opacity: 0.55 })
    );
    foup.position.set(-0.35, 0.90 + 0.165, 0.35);
    scene.add(foup);

    // 4. EFEM + Load Locks + VTM Hex + 4 Process Modules
    const efem = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 2.2, 0.85),
      new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.5, roughness: 0.35 })
    );
    efem.position.set(0, 1.1, -0.25);
    scene.add(efem);

    const loadLock = new THREE.Mesh(
      new THREE.BoxGeometry(0.85, 0.55, 0.60),
      new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.6 })
    );
    loadLock.position.set(0, 1.05, -0.95);
    scene.add(loadLock);

    const vtm = new THREE.Mesh(
      new THREE.CylinderGeometry(0.75, 0.75, 0.55, 6),
      new THREE.MeshStandardMaterial({ color: 0x0f766e, metalness: 0.65, roughness: 0.3 })
    );
    vtm.position.set(0, 1.05, -1.95);
    scene.add(vtm);

    const pmGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.62, 24);
    const pmMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.5, roughness: 0.35 });
    const pmOffsets = [[-0.95, -1.55], [0.95, -1.55], [-0.95, -2.35], [0.95, -2.35]];
    pmOffsets.forEach(([px, pz]) => {
      const pm = new THREE.Mesh(pmGeo, pmMat);
      pm.position.set(px, 1.05, pz);
      scene.add(pm);
    });

    // 5. OHT Overhead Track (Z = 3.50m) & Moving Hoist Vehicle
    const rail = new THREE.Mesh(
      new THREE.BoxGeometry(6.0, 0.12, 0.24),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.6 })
    );
    rail.position.set(0, 3.50, 0.35);
    scene.add(rail);

    const oht = new THREE.Mesh(
      new THREE.BoxGeometry(0.65, 0.32, 0.36),
      new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.35 })
    );
    oht.position.set(-2.0, 3.30, 0.35);
    scene.add(oht);

    // Interactive Controls
    let lithoAmber = false;
    let ohtMoving = true;
    const btnAmber = document.getElementById("btnAmber");
    const btnOht = document.getElementById("btnOht");
    const btnReset = document.getElementById("btnReset");

    btnAmber.onclick = () => {
      lithoAmber = !lithoAmber;
      btnAmber.classList.toggle("active", lithoAmber);
      const col = lithoAmber ? 0xffb000 : 0xffffff;
      ambient.color.setHex(col);
      dirLight.color.setHex(col);
      scene.background.setHex(lithoAmber ? 0x1a1103 : 0x0b1120);
    };
    btnOht.onclick = () => { ohtMoving = !ohtMoving; };
    btnReset.onclick = () => { camera.position.set(4.5, 3.2, 5.2); controls.target.set(0, 1.3, 0); };

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      if (ohtMoving) {
        t += 0.012;
        oht.position.x = Math.sin(t) * 2.3;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
