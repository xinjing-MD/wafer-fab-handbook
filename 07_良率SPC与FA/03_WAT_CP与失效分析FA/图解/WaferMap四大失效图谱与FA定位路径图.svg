<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Title -->
  <text x="480" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">CP Wafer Map 四大典型失效图谱与失效分析（EFA → PFA）定位路径</text>
  <text x="480" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">Wafer Sort Defect Signatures Diagnosis &amp; Electrical / Physical Failure Analysis Workflow</text>

  <!-- Left 4 Wafer Map Patterns (2x2 grid) -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="520" height="375" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="260" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">CP 晶圆分布图（Wafer Map）典型空间特征与根因直觉</text>

    <!-- Pattern 1: Edge Ring -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="230" height="150" rx="6" fill="#0f172a" stroke="#475569" />
      <circle cx="55" cy="75" r="46" fill="#10b981" stroke="#ef4444" stroke-width="10" />
      <circle cx="55" cy="75" r="34" fill="#10b981" />
      <text x="55" y="79" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">良品区</text>
      <text x="115" y="35" fill="#f87171" font-size="11" font-weight="bold">1. Edge Ring 边缘环</text>
      <text x="115" y="58" fill="#cbd5e1" font-size="8">• CMP 边缘过抛磨穿</text>
      <text x="115" y="75" fill="#cbd5e1" font-size="8">• 刻蚀 Focus Ring 老化</text>
      <text x="115" y="92" fill="#cbd5e1" font-size="8">• 旋涂边缘 EBR / 甩干水痕</text>
      <text x="115" y="114" fill="#94a3b8" font-size="8">对策: 查 CMP Zone5 气囊</text>
    </g>

    <!-- Pattern 2: Center Bullseye -->
    <g transform="translate(270, 42)">
      <rect x="0" y="0" width="230" height="150" rx="6" fill="#0f172a" stroke="#475569" />
      <circle cx="55" cy="75" r="46" fill="#10b981" stroke="#334155" stroke-width="2" />
      <circle cx="55" cy="75" r="21" fill="#ef4444" />
      <text x="55" y="79" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">中心死区</text>
      <text x="115" y="35" fill="#fb923c" font-size="11" font-weight="bold">2. Center Bullseye</text>
      <text x="115" y="58" fill="#cbd5e1" font-size="8">• 腔室喷淋头中心气流不均</text>
      <text x="115" y="75" fill="#cbd5e1" font-size="8">• ESC 中心温区或氦气背冷故障</text>
      <text x="115" y="92" fill="#cbd5e1" font-size="8">• CMP 中心下压力偏移</text>
      <text x="115" y="114" fill="#94a3b8" font-size="8">对策: 查 ESC/Showerhead</text>
    </g>

    <!-- Pattern 3: CMP Scratch Arc -->
    <g transform="translate(20, 208)">
      <rect x="0" y="0" width="230" height="150" rx="6" fill="#0f172a" stroke="#475569" />
      <circle cx="55" cy="75" r="46" fill="#10b981" stroke="#334155" stroke-width="2" />
      <path d="M 28,45 Q 65,65 88,108" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
      <text x="115" y="35" fill="#facc15" font-size="11" font-weight="bold">3. Scratch 弧形划伤</text>
      <text x="115" y="58" fill="#cbd5e1" font-size="8">• CMP 研磨液团聚大颗粒</text>
      <text x="115" y="75" fill="#cbd5e1" font-size="8">• 修整盘金刚石颗粒脱落</text>
      <text x="115" y="92" fill="#cbd5e1" font-size="8">• PVA 滚刷夹杂铜屑划伤</text>
      <text x="115" y="114" fill="#94a3b8" font-size="8">对策: 检过滤芯及刷子</text>
    </g>

    <!-- Pattern 4: Reticle Repeater -->
    <g transform="translate(270, 208)">
      <rect x="0" y="0" width="230" height="150" rx="6" fill="#0f172a" stroke="#475569" />
      <circle cx="55" cy="75" r="46" fill="#10b981" stroke="#334155" stroke-width="2" />
      <!-- Repeater grid dots -->
      <rect x="28" y="45" width="7" height="7" fill="#ef4444" />
      <rect x="52" y="45" width="7" height="7" fill="#ef4444" />
      <rect x="76" y="45" width="7" height="7" fill="#ef4444" />
      <rect x="28" y="72" width="7" height="7" fill="#ef4444" />
      <rect x="52" y="72" width="7" height="7" fill="#ef4444" />
      <rect x="76" y="72" width="7" height="7" fill="#ef4444" />
      <rect x="28" y="99" width="7" height="7" fill="#ef4444" />
      <rect x="52" y="99" width="7" height="7" fill="#ef4444" />
      <text x="115" y="35" fill="#c084fc" font-size="11" font-weight="bold">4. Reticle 周期死点</text>
      <text x="115" y="58" fill="#cbd5e1" font-size="8">• 间距精准等于曝光场尺寸</text>
      <text x="115" y="75" fill="#f87171" font-size="8">• 100% 锁定光罩有脏污或损伤!</text>
      <text x="115" y="92" fill="#cbd5e1" font-size="8">• 无需切片 EMMI 即可锁死光罩</text>
      <text x="115" y="114" fill="#94a3b8" font-size="8">对策: 立即停用清洗 Reticle</text>
    </g>
  </g>

  <!-- Right: EFA -> PFA Workflow -->
  <g transform="translate(570, 75)">
    <rect x="0" y="0" width="360" height="375" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="180" y="24" fill="#fda4af" font-size="13" font-weight="bold" text-anchor="middle">失效分析（FA）标准路径：先电定位，后物理切片</text>

    <g transform="translate(15, 42)">
      <rect x="0" y="0" width="330" height="145" rx="6" fill="#0f172a" stroke="#38bdf8" />
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="bold">一、EFA 电性定位（非破坏，锁定坐标）</text>
      <text x="12" y="42" fill="#cbd5e1" font-size="9">1. Curve Tracer I-V：定性开路 (Open) / 短路 / 漏电</text>
      <text x="12" y="64" fill="#cbd5e1" font-size="9">2. EMMI 微光显微镜：捕捉 PN 结击穿或栅氧漏电光子热点</text>
      <text x="12" y="86" fill="#cbd5e1" font-size="9">3. OBIRCH / TIVA：激光局部加热扫描定位微短路或金属空洞</text>
      <text x="12" y="112" fill="#34d399" font-size="8">★ 目标：将失效区域从整颗芯片几平方厘米锁定到 &lt; 1 μm² 热点</text>
    </g>

    <line x1="180" y1="187" x2="180" y2="205" stroke="#f43f5e" stroke-width="2.5" />

    <g transform="translate(15, 205)">
      <rect x="0" y="0" width="330" height="155" rx="6" fill="#0f172a" stroke="#f43f5e" />
      <text x="12" y="20" fill="#fb7185" font-size="11" font-weight="bold">二、PFA 物理剖析（破坏性切片，查清元凶）</text>
      <text x="12" y="42" fill="#cbd5e1" font-size="9">1. De-layering 逐层化学/CMP剥层：逐层 SEM 寻金属桥接</text>
      <text x="12" y="64" fill="#cbd5e1" font-size="9">2. Dual-Beam FIB 精准离子束切片：制出 &lt; 50nm 超薄片</text>
      <text x="12" y="86" fill="#cbd5e1" font-size="9">3. TEM 透射电镜 + EDS 能谱：看原子晶格并打出污染元素指纹</text>
      <text x="12" y="114" fill="#fde047" font-size="8">★ 闭环结果：将真实异常元素 (Al/Cu/C/F) 反馈 Commonality</text>
      <text x="12" y="130" fill="#fde047" font-size="8">  定位至问题腔室并更新全厂 FDC 拦截阈值</text>
    </g>
  </g>
</svg>
