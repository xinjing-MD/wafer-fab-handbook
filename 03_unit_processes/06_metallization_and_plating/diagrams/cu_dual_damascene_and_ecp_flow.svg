<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Title -->
  <text x="480" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">后道铜双大马士革（Dual Damascene）全流程与电镀自底向上超填机制</text>
  <text x="480" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">BEOL Copper Dual Damascene Integration &amp; ECP Superfilling Kinetics</text>

  <!-- Flow Steps (6 Cross-Sections) -->
  <g transform="translate(30, 75)">
    <!-- Step 1: Low-k Dielectric Stack & Trench/Via Etch -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="70" y="24" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">1. 双大马士革刻蚀</text>
      
      <!-- Dielectric layer -->
      <rect x="15" y="45" width="110" height="110" fill="#334155" />
      <!-- Trench and Via Profile -->
      <polygon points="30,45 110,45 110,80 85,80 85,150 55,150 55,80 30,80" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
      <text x="70" y="65" fill="#94a3b8" font-size="8" text-anchor="middle">Trench 沟槽</text>
      <text x="70" y="115" fill="#94a3b8" font-size="8" text-anchor="middle">Via 通孔</text>

      <!-- Bottom metal M1 -->
      <rect x="40" y="150" width="60" height="15" fill="#d97706" />
      <text x="70" y="162" fill="#fef08a" font-size="8" text-anchor="middle">下层导线 M1</text>

      <text x="70" y="185" fill="#cbd5e1" font-size="8" text-anchor="middle">先通孔后沟槽</text>
      <text x="70" y="200" fill="#94a3b8" font-size="7" text-anchor="middle">(Via-first flow)</text>
    </g>

    <!-- Step 2: PVD Barrier Layer (TaN/Ta) -->
    <g transform="translate(155, 0)">
      <rect x="0" y="0" width="140" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="70" y="24" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">2. PVD 扩散阻挡层</text>

      <rect x="15" y="45" width="110" height="110" fill="#334155" />
      <polygon points="30,45 110,45 110,80 85,80 85,150 55,150 55,80 30,80" fill="#0f172a" />
      <rect x="40" y="150" width="60" height="15" fill="#d97706" />

      <!-- TaN/Ta Liner in Red -->
      <polyline points="30,45 30,80 55,80 55,150 85,150 85,80 110,80 110,45" fill="none" stroke="#ef4444" stroke-width="3" />
      
      <text x="70" y="185" fill="#fca5a5" font-size="8" text-anchor="middle">TaN / Ta 阻挡层 (~3nm)</text>
      <text x="70" y="200" fill="#94a3b8" font-size="7" text-anchor="middle">阻断铜原子向介质扩散</text>
    </g>

    <!-- Step 3: PVD Cu Seed Layer -->
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="140" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="70" y="24" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">3. PVD 铜种子层</text>

      <rect x="15" y="45" width="110" height="110" fill="#334155" />
      <polygon points="30,45 110,45 110,80 85,80 85,150 55,150 55,80 30,80" fill="#0f172a" />
      <rect x="40" y="150" width="60" height="15" fill="#d97706" />

      <polyline points="30,45 30,80 55,80 55,150 85,150 85,80 110,80 110,45" fill="none" stroke="#ef4444" stroke-width="2" />
      <!-- Cu Seed layer in Gold -->
      <polyline points="32,45 32,82 57,82 57,148 83,148 83,82 108,82 108,45" fill="none" stroke="#f59e0b" stroke-width="2.5" />

      <text x="70" y="185" fill="#fef08a" font-size="8" text-anchor="middle">薄铜种子层 Cu Seed</text>
      <text x="70" y="200" fill="#94a3b8" font-size="7" text-anchor="middle">为后续电镀提供导电阴极</text>
    </g>

    <!-- Step 4: ECP Electro-Chemical Plating (Superfilling) -->
    <g transform="translate(465, 0)">
      <rect x="0" y="0" width="150" height="230" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <text x="75" y="24" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">4. 电化学电镀 (ECP)</text>

      <rect x="15" y="45" width="120" height="110" fill="#334155" />
      <rect x="40" y="150" width="70" height="15" fill="#d97706" />
      <!-- Copper Overburden Filling -->
      <polygon points="25,35 125,35 125,80 90,80 90,150 60,150 60,80 25,80" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
      <rect x="20" y="32" width="110" height="13" fill="#d97706" />

      <text x="75" y="60" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Overburden</text>
      <text x="75" y="115" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">无空洞超填</text>

      <text x="75" y="185" fill="#34d399" font-size="8" font-weight="bold" text-anchor="middle">Bottom-up Superfilling</text>
      <text x="75" y="200" fill="#94a3b8" font-size="7" text-anchor="middle">无缝隙无空洞 (Void-free)</text>
    </g>

    <!-- Step 5: Anneal -->
    <g transform="translate(630, 0)">
      <rect x="0" y="0" width="130" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="65" y="24" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">5. 晶粒长大退火</text>

      <rect x="15" y="45" width="100" height="110" fill="#334155" />
      <polygon points="25,35 105,35 105,80 75,80 75,150 55,150 55,80 25,80" fill="#ea580c" />
      <rect x="20" y="32" width="90" height="13" fill="#ea580c" />

      <!-- Flame symbol -->
      <text x="65" y="105" fill="#fef08a" font-size="14" text-anchor="middle">♨</text>
      <text x="65" y="125" fill="#ffffff" font-size="8" text-anchor="middle">200~350°C</text>

      <text x="65" y="185" fill="#cbd5e1" font-size="8" text-anchor="middle">铜晶粒粗化</text>
      <text x="65" y="200" fill="#94a3b8" font-size="7" text-anchor="middle">降电阻率 + 增强抗电迁移</text>
    </g>

    <!-- Step 6: Cu & Barrier CMP -->
    <g transform="translate(775, 0)">
      <rect x="0" y="0" width="130" height="230" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <text x="65" y="24" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">6. Cu CMP 抛光</text>

      <rect x="15" y="45" width="100" height="110" fill="#334155" />
      <!-- Polished flat copper structure -->
      <polygon points="30,45 100,45 100,80 75,80 75,150 55,150 55,80 30,80" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
      <!-- Flat top interface line -->
      <line x1="15" y1="45" x2="115" y2="45" stroke="#10b981" stroke-width="3" />

      <text x="65" y="115" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">M2 导线</text>

      <text x="65" y="185" fill="#34d399" font-size="8" font-weight="bold" text-anchor="middle">全局平坦表面</text>
      <text x="65" y="200" fill="#94a3b8" font-size="7" text-anchor="middle">准备制作下一层 M3 互连</text>
    </g>
  </g>

  <!-- Bottom Detailed Explanation of ECP Additives -->
  <g transform="translate(30, 320)">
    <rect x="0" y="0" width="900" height="70" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="20" y="22" fill="#fef08a" font-size="11" font-weight="bold">ECP 电镀三大核心有机添加剂协同超填机制 (Superfilling Dynamics)：</text>
    
    <text x="20" y="42" fill="#cbd5e1" font-size="9"><tspan fill="#34d399" font-weight="bold">1. 加速剂 (Accelerator):</tspan> 含硫小分子，吸附在通孔与沟槽底部深处，剧烈加速底部铜原子析出生长速率</text>
    <text x="20" y="58" fill="#cbd5e1" font-size="9"><tspan fill="#ef4444" font-weight="bold">2. 抑制剂 (Suppressor):</tspan> 高分子聚合物 (PEG)，扩散速度慢，主要聚集在槽口与表面，抑制顶部铜生长防封口</text>
    <text x="560" y="58" fill="#cbd5e1" font-size="9"><tspan fill="#38bdf8" font-weight="bold">3. 整平剂 (Leveler):</tspan> 消除局部隆起，确保平整</text>
  </g>
</svg>
