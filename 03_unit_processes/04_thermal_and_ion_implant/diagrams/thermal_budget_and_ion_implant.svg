<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Title -->
  <text x="480" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">热预算退火技术演化（炉管/RTP/毫秒激光）与离子注入防沟道效应</text>
  <text x="480" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Thermal Budget Scaling (Furnace vs RTP vs LSA) &amp; Ion Implantation Channeling Prevention</text>

  <!-- Left: Thermal Budget Scaling Curves -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="430" height="375" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <text x="215" y="24" fill="#fb923c" font-size="13" font-weight="bold" text-anchor="middle">退火热预算 (Thermal Budget) 演化曲线</text>

    <!-- Axes -->
    <line x1="50" y1="210" x2="390" y2="210" stroke="#64748b" stroke-width="1.5" />
    <line x1="50" y1="210" x2="50" y2="45" stroke="#64748b" stroke-width="1.5" />
    <text x="390" y="225" fill="#94a3b8" font-size="10">时间 (对数尺度)</text>
    <text x="15" y="50" fill="#94a3b8" font-size="10">温度 (°C)</text>

    <!-- Temp Ticks -->
    <text x="40" y="70" fill="#94a3b8" font-size="9" text-anchor="end">1100°C</text>
    <line x1="47" y1="65" x2="53" y2="65" stroke="#94a3b8" />
    <text x="40" y="140" fill="#94a3b8" font-size="9" text-anchor="end">900°C</text>
    <line x1="47" y1="135" x2="53" y2="135" stroke="#94a3b8" />

    <!-- Curve 1: Traditional Furnace -->
    <path d="M 50,205 Q 80,110 120,110 L 220,110 Q 250,110 280,205" fill="none" stroke="#ef4444" stroke-width="2.5" />
    <text x="170" y="100" fill="#f87171" font-size="10" font-weight="bold">1. 传统立式炉管 (30~60 分钟)</text>
    <text x="170" y="125" fill="#fca5a5" font-size="8">热预算极大，导致杂质剧烈横向扩散破坏短沟道</text>

    <!-- Curve 2: RTP / Spike Anneal -->
    <path d="M 50,205 Q 70,60 85,60 Q 100,60 115,205" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <text x="95" y="55" fill="#fef08a" font-size="9" font-weight="bold">2. 尖峰退火 (RTP/Spike ~1秒)</text>

    <!-- Curve 3: Laser Spike Anneal (LSA / Flash) -->
    <line x1="60" y1="205" x2="62" y2="60" stroke="#10b981" stroke-width="3" />
    <line x1="62" y1="60" x2="64" y2="205" stroke="#10b981" stroke-width="3" />
    <text x="75" y="75" fill="#34d399" font-size="9" font-weight="bold">3. 毫秒激光退火 (LSA ~1ms)</text>

    <!-- Bottom summary box -->
    <rect x="20" y="240" width="390" height="115" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="30" y="260" fill="#fb923c" font-size="10" font-weight="bold">先进制程（≤14nm）热预算控制法则：</text>
    <text x="30" y="278" fill="#cbd5e1" font-size="9">• 目标：实现 100% 杂质固溶度激活，同时原子零扩散 (Zero Diffusion)</text>
    <text x="30" y="295" fill="#cbd5e1" font-size="9">• 难点：超浅结 (USJ) 结深 Xj 必须控制在 &lt; 10 nm 量级</text>
    <text x="30" y="312" fill="#cbd5e1" font-size="9">• 组合拳：低温预非晶化注入 (PAI) + 毫秒激光快速表面重结晶</text>
    <text x="30" y="330" fill="#94a3b8" font-size="8">• BEOL 后段温度上限严格锁死在 400°C 以下（防铜互连熔塌与低 k 劣化）</text>
  </g>

  <!-- Right: Ion Implanter & Channeling Effect -->
  <g transform="translate(490, 75)">
    <rect x="0" y="0" width="430" height="375" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="215" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">离子注入系统光路与晶格防沟道效应</text>

    <!-- Implanter Subsystem Flow -->
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="85" height="40" rx="4" fill="#0f172a" stroke="#0284c7" />
      <text x="42" y="18" fill="#e0f2fe" font-size="9" text-anchor="middle">气体电离源</text>
      <text x="42" y="32" fill="#38bdf8" font-size="8" text-anchor="middle">AsH3 / BF3</text>

      <line x1="85" y1="20" x2="105" y2="20" stroke="#38bdf8" stroke-width="1.5" />

      <rect x="105" y="0" width="95" height="40" rx="4" fill="#0f172a" stroke="#0284c7" />
      <text x="152" y="18" fill="#e0f2fe" font-size="9" text-anchor="middle">质量分析磁铁</text>
      <text x="152" y="32" fill="#94a3b8" font-size="8" text-anchor="middle">按质荷比 q/m 选离子</text>

      <line x1="200" y1="20" x2="220" y2="20" stroke="#38bdf8" stroke-width="1.5" />

      <rect x="220" y="0" width="85" height="40" rx="4" fill="#0f172a" stroke="#0284c7" />
      <text x="262" y="18" fill="#e0f2fe" font-size="9" text-anchor="middle">静电加速管</text>
      <text x="262" y="32" fill="#94a3b8" font-size="8" text-anchor="middle">keV ~ MeV 调深浅</text>

      <line x1="305" y1="20" x2="325" y2="20" stroke="#38bdf8" stroke-width="1.5" />

      <rect x="325" y="0" width="70" height="40" rx="4" fill="#0284c7" />
      <text x="360" y="18" fill="#ffffff" font-size="9" text-anchor="middle">靶室</text>
      <text x="360" y="32" fill="#bae6fd" font-size="8" text-anchor="middle">晶圆工件台</text>
    </g>

    <!-- Channeling Effect Illustration -->
    <g transform="translate(20, 105)">
      <rect x="0" y="0" width="390" height="245" rx="6" fill="#0f172a" stroke="#475569" />
      <text x="15" y="22" fill="#38bdf8" font-size="11" font-weight="bold">沟道效应（Channeling Effect）产生与消除：</text>

      <!-- Sub-panel A: Vertical Injection (bad) -->
      <g transform="translate(15, 35)">
        <rect x="0" y="0" width="170" height="100" rx="4" fill="#1e293b" />
        <text x="85" y="16" fill="#ef4444" font-size="9" font-weight="bold" text-anchor="middle">0° 垂直入射 (严重沟道效应)</text>
        <!-- Silicon crystal columns -->
        <circle cx="30" cy="35" r="4" fill="#94a3b8" /><circle cx="65" cy="35" r="4" fill="#94a3b8" /><circle cx="100" cy="35" r="4" fill="#94a3b8" /><circle cx="135" cy="35" r="4" fill="#94a3b8" />
        <circle cx="30" cy="65" r="4" fill="#94a3b8" /><circle cx="65" cy="65" r="4" fill="#94a3b8" /><circle cx="100" cy="65" r="4" fill="#94a3b8" /><circle cx="135" cy="65" r="4" fill="#94a3b8" />
        <line x1="47" y1="20" x2="47" y2="90" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2" />
        <text x="85" y="88" fill="#fca5a5" font-size="8" text-anchor="middle">离子沿晶格通道直钻深处</text>
      </g>

      <!-- Sub-panel B: 7-degree Tilt & Twist (good) -->
      <g transform="translate(200, 35)">
        <rect x="0" y="0" width="175" height="100" rx="4" fill="#1e293b" />
        <text x="87" y="16" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle">7° Tilt + Twist 倾斜旋转注入</text>
        <circle cx="30" cy="35" r="4" fill="#94a3b8" /><circle cx="65" cy="35" r="4" fill="#94a3b8" /><circle cx="100" cy="35" r="4" fill="#94a3b8" /><circle cx="135" cy="35" r="4" fill="#94a3b8" />
        <circle cx="30" cy="65" r="4" fill="#94a3b8" /><circle cx="65" cy="65" r="4" fill="#94a3b8" /><circle cx="100" cy="65" r="4" fill="#94a3b8" /><circle cx="135" cy="65" r="4" fill="#94a3b8" />
        <line x1="40" y1="20" x2="65" y2="55" stroke="#10b981" stroke-width="2" />
        <text x="87" y="88" fill="#6ee7b7" font-size="8" text-anchor="middle">离子频繁碰撞晶格，结深精准受控</text>
      </g>

      <!-- Bottom bullet points -->
      <text x="15" y="160" fill="#cbd5e1" font-size="9">• 两个独立关键参数：注入能量（控制结深 Xj）与 束流积分时间（控制掺杂剂量 Dose）</text>
      <text x="15" y="180" fill="#cbd5e1" font-size="9">• FinFET 3D 挑战：需采用 Quad Implant（四向旋转注入）避免三维鳍片阴影效应 (Shadowing)</text>
      <text x="15" y="200" fill="#f59e0b" font-size="9">• 等离子体掺杂 (PLAD)：针对 2nm/3nm 结构超高保形浅掺杂的先进新方案</text>
    </g>
  </g>
</svg>
