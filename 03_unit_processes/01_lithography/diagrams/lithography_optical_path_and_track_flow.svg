<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="480" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">光刻系统光学投影曝光机理与 Track 涂胶显影联机闭环</text>
  <text x="480" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Lithography Optical Projection (4:1 Reduction) &amp; Inline Track Sequence</text>

  <!-- Left: Scanner Optical Column (4:1 Reduction) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="340" height="375" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="170" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Scanner 曝光光路 (4:1 缩束投影)</text>

    <!-- Light Source (ArF 193nm / EUV 13.5nm) -->
    <rect x="110" y="38" width="120" height="28" rx="4" fill="#0284c7" />
    <text x="170" y="56" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">准分子激光源 (193nm)</text>

    <!-- Beam & Illumination Optics -->
    <polygon points="170,66 120,95 220,95" fill="url(#laserBeam)" />
    <path d="M 120,95 Q 170,110 220,95" fill="url(#lensGrad)" stroke="#38bdf8" />
    <text x="235" y="102" fill="#94a3b8" font-size="9">照明系统 (OAI 离轴)</text>

    <!-- Reticle Stage / Mask -->
    <line x1="80" y1="125" x2="260" y2="125" stroke="#e2e8f0" stroke-width="3" />
    <rect x="125" y="122" width="90" height="6" fill="#f59e0b" />
    <text x="170" y="140" fill="#fef08a" font-size="10" font-weight="bold" text-anchor="middle">光罩/掩模版 (4X 放大电路图形)</text>

    <!-- 4:1 Projection Optics (Lens Group) -->
    <polygon points="125,128 145,210 195,210 215,128" fill="url(#laserBeam)" />
    <path d="M 140,210 Q 170,230 200,210" fill="url(#lensGrad)" stroke="#38bdf8" stroke-width="2" />
    <text x="235" y="215" fill="#94a3b8" font-size="9">投影物镜组 (NA=1.35)</text>
    <polygon points="145,210 162,260 178,260 195,210" fill="url(#laserBeam)" />

    <!-- Immersion Water Layer -->
    <rect x="155" y="260" width="30" height="8" fill="#06b6d4" opacity="0.8" />
    <text x="210" y="268" fill="#06b6d4" font-size="9">浸没纯水层 (n=1.44)</text>

    <!-- Wafer on Dual Chuck Stage -->
    <rect x="70" y="268" width="200" height="10" rx="3" fill="#64748b" />
    <circle cx="170" cy="273" r="5" fill="#10b981" />
    <text x="170" y="295" fill="#e2e8f0" font-size="10" text-anchor="middle">晶圆 1X 纳米曝光聚焦 (300mm)</text>

    <rect x="40" y="308" width="260" height="50" rx="6" fill="#0f172a" stroke="#475569" />
    <text x="50" y="326" fill="#f8fafc" font-size="10" font-weight="bold">双工件台 (TwinScan 技术):</text>
    <text x="50" y="342" fill="#94a3b8" font-size="9">一侧曝光晶圆 A / 另一侧同步测高测平对准晶圆 B</text>
  </g>

  <!-- Right: Track (Coater / Developer) Sequence -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="500" height="375" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="250" y="24" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Track 涂胶显影机核心流转闭环 (TEL / DNS)</text>

    <!-- Step Boxes in 2 Rows -->
    <!-- Row 1: Coating and Pre-Exposure -->
    <rect x="25" y="45" width="130" height="58" rx="6" fill="#0f172a" stroke="#3b82f6" />
    <text x="35" y="65" fill="#60a5fa" font-size="11" font-weight="bold">1. HMDS / 旋涂 BARC</text>
    <text x="35" y="80" fill="#94a3b8" font-size="9">增粘处理 + 抗反射层</text>
    <text x="35" y="94" fill="#64748b" font-size="8">防驻波效应</text>

    <line x1="155" y1="74" x2="185" y2="74" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="185" y="45" width="130" height="58" rx="6" fill="#0f172a" stroke="#3b82f6" />
    <text x="195" y="65" fill="#60a5fa" font-size="11" font-weight="bold">2. 旋涂光刻胶 (PR)</text>
    <text x="195" y="80" fill="#94a3b8" font-size="9">精密滴胶 + 3000RPM</text>
    <text x="195" y="94" fill="#64748b" font-size="8">膜厚 40~200nm</text>

    <line x1="315" y1="74" x2="345" y2="74" stroke="#38bdf8" stroke-width="2" />

    <rect x="345" y="45" width="130" height="58" rx="6" fill="#0f172a" stroke="#3b82f6" />
    <text x="355" y="65" fill="#60a5fa" font-size="11" font-weight="bold">3. 前烘 (Soft Bake)</text>
    <text x="355" y="80" fill="#94a3b8" font-size="9">90~110°C 挥发溶剂</text>
    <text x="355" y="94" fill="#64748b" font-size="8">热板冷却调温</text>

    <!-- Connector to Scanner -->
    <path d="M 410,103 L 410,135 L 250,135 L 250,150" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
    <text x="330" y="130" fill="#fef08a" font-size="9">传送至 Scanner 曝光</text>

    <!-- Exposure Node -->
    <rect x="175" y="150" width="150" height="45" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="250" y="170" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">4. Scanner 曝光反应</text>
    <text x="250" y="186" fill="#fed7aa" font-size="9" text-anchor="middle">光敏剂激发出游离光酸 (H+)</text>

    <!-- Flow down to Row 2 -->
    <line x1="250" y1="195" x2="250" y2="225" stroke="#10b981" stroke-width="2" />

    <!-- Row 2: Post Exposure Processing -->
    <rect x="25" y="225" width="130" height="58" rx="6" fill="#0f172a" stroke="#10b981" />
    <text x="35" y="245" fill="#34d399" font-size="11" font-weight="bold">5. 曝光后烘烤 (PEB)</text>
    <text x="35" y="260" fill="#94a3b8" font-size="9">酸催化放大反应 (CAR)</text>
    <text x="35" y="274" fill="#ef4444" font-size="8">温控极严 ±0.05°C</text>

    <line x1="185" y1="254" x2="155" y2="254" stroke="#10b981" stroke-width="2" />

    <rect x="185" y="225" width="130" height="58" rx="6" fill="#0f172a" stroke="#10b981" />
    <text x="195" y="245" fill="#34d399" font-size="11" font-weight="bold">6. 显影 (Develop)</text>
    <text x="195" y="260" fill="#94a3b8" font-size="9">TMAH 碱液溶解曝光区</text>
    <text x="195" y="274" fill="#64748b" font-size="8">超纯水清洗甩干</text>

    <line x1="315" y1="254" x2="345" y2="254" stroke="#10b981" stroke-width="2" />

    <rect x="345" y="225" width="130" height="58" rx="6" fill="#0f172a" stroke="#10b981" />
    <text x="355" y="245" fill="#34d399" font-size="11" font-weight="bold">7. 坚膜 (Hard Bake)</text>
    <text x="355" y="260" fill="#94a3b8" font-size="9">120~140°C 硬化胶体</text>
    <text x="355" y="274" fill="#64748b" font-size="8">提高耐刻蚀轰击性</text>

    <!-- Inspection and Rework Branch -->
    <rect x="25" y="310" width="450" height="50" rx="6" fill="#0f172a" stroke="#64748b" />
    <text x="40" y="330" fill="#f8fafc" font-size="10" font-weight="bold">8. 显影后检查 ADI (CD-SEM 测线宽 + Overlay 测套刻)</text>
    <text x="40" y="348" fill="#10b981" font-size="9">✔ 合格 ──&gt; 送干法刻蚀 / 离子注入</text>
    <text x="250" y="348" fill="#f87171" font-size="9">✘ 超差 ──&gt; Rework 剥除光刻胶重涂 (唯一低成本返工节点!)</text>
  </g>
</svg>
