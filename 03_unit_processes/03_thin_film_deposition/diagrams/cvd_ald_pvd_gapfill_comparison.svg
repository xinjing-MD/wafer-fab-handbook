<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Title -->
  <text x="480" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">高深宽比微沟槽填充（Gap Fill）技术对比：PVD vs CVD vs ALD</text>
  <text x="480" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Step Coverage and Keyhole Defect Evolution across Thin Film Deposition Techniques</text>

  <!-- Panel 1: PVD (Sputtering) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="270" height="375" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <text x="135" y="24" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle">PVD 物理溅射 (Sputtering)</text>
    <text x="135" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">视线传输 (Line-of-Sight) / 易形成空洞</text>

    <!-- Deep Trench -->
    <path d="M 45,70 L 95,70 L 95,230 L 175,230 L 175,70 L 225,70" fill="none" stroke="#475569" stroke-width="4" />
    <!-- Overhang film -->
    <path d="M 45,66 L 95,66 Q 115,66 115,80 L 100,110 L 95,230 L 175,230 L 170,110 L 155,80 Q 155,66 175,66 L 225,66" fill="#f87171" opacity="0.3" stroke="#ef4444" stroke-width="2" />
    <!-- Pinched off Keyhole Void -->
    <ellipse cx="135" cy="170" rx="20" ry="40" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="135" y="174" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">封口空洞 (Keyhole)</text>

    <!-- Overhang annotation -->
    <line x1="115" y1="78" x2="145" y2="95" stroke="#fbbf24" stroke-width="1" />
    <text x="150" y="98" fill="#fef08a" font-size="9">槽口悬垂 (Overhang)</text>

    <rect x="15" y="255" width="240" height="105" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="275" fill="#f87171" font-size="10" font-weight="bold">技术特征总结：</text>
    <text x="25" y="293" fill="#cbd5e1" font-size="9">• 台阶覆盖率: 极差 (&lt; 20%)</text>
    <text x="25" y="310" fill="#cbd5e1" font-size="9">• 成膜温度: 室温 ~ 300°C</text>
    <text x="25" y="327" fill="#cbd5e1" font-size="9">• 适用: 平面金属化、Cu Seed、Al Pad</text>
    <text x="25" y="344" fill="#94a3b8" font-size="8">深孔需配合离子化 PVD (IPVD) 改善</text>
  </g>

  <!-- Panel 2: CVD (LPCVD / PECVD) -->
  <g transform="translate(345, 75)">
    <rect x="0" y="0" width="270" height="375" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="135" y="24" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">CVD 化学气相沉积</text>
    <text x="135" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">气相扩散与热分解反应</text>

    <!-- Deep Trench -->
    <path d="M 45,70 L 95,70 L 95,230 L 175,230 L 175,70 L 225,70" fill="none" stroke="#475569" stroke-width="4" />
    <!-- Conformal CVD film -->
    <path d="M 45,62 L 95,62 L 110,70 L 110,215 L 160,215 L 160,70 L 175,62 L 225,62" fill="#60a5fa" opacity="0.3" stroke="#3b82f6" stroke-width="2" />
    <text x="135" y="150" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">良好台阶覆盖</text>

    <!-- Thickness indicator -->
    <text x="135" y="170" fill="#cbd5e1" font-size="9" text-anchor="middle">侧壁略薄 / 底部适中</text>

    <rect x="15" y="255" width="240" height="105" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="275" fill="#60a5fa" font-size="10" font-weight="bold">技术特征总结：</text>
    <text x="25" y="293" fill="#cbd5e1" font-size="9">• 台阶覆盖率: 良好 (50% ~ 80%)</text>
    <text x="25" y="310" fill="#cbd5e1" font-size="9">• 成膜温度: 250°C (PECVD) ~ 750°C (LPCVD)</text>
    <text x="25" y="327" fill="#cbd5e1" font-size="9">• 适用: 多晶硅栅极、SiO2 填隙、W 接触栓塞</text>
    <text x="25" y="344" fill="#94a3b8" font-size="8">极限深宽比下可能形成微缝隙 (Seam)</text>
  </g>

  <!-- Panel 3: ALD (Atomic Layer Deposition) -->
  <g transform="translate(650, 75)">
    <rect x="0" y="0" width="270" height="375" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="135" y="24" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">ALD 原子层沉积</text>
    <text x="135" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">表面自限制饱和反应 (Self-Limiting)</text>

    <!-- Deep Trench -->
    <path d="M 45,70 L 95,70 L 95,230 L 175,230 L 175,70 L 225,70" fill="none" stroke="#475569" stroke-width="4" />
    <!-- 100% Conformal ALD film -->
    <path d="M 45,64 L 95,64 L 104,70 L 104,222 L 166,222 L 166,70 L 175,64 L 225,64" fill="#34d399" opacity="0.3" stroke="#10b981" stroke-width="2" />
    <text x="135" y="140" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">100% 极限保形性</text>
    <text x="135" y="160" fill="#ffffff" font-size="9" text-anchor="middle">顶部 = 侧壁 = 底部厚度</text>
    <text x="135" y="175" fill="#fef08a" font-size="9" text-anchor="middle">深宽比 &gt; 100:1 依然无空洞</text>

    <rect x="15" y="255" width="240" height="105" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="25" y="275" fill="#34d399" font-size="10" font-weight="bold">技术特征总结：</text>
    <text x="25" y="293" fill="#cbd5e1" font-size="9">• 台阶覆盖率: 完美 (~100%)</text>
    <text x="25" y="310" fill="#cbd5e1" font-size="9">• 单循环厚度: ~0.1 nm / 周期 (膜厚原子级可控)</text>
    <text x="25" y="327" fill="#cbd5e1" font-size="9">• 适用: HKMG (HfO2)、GAA 纳米片、SAQP 侧墙</text>
    <text x="25" y="344" fill="#f87171" font-size="8">缺点: 沉积速率慢，需 Spatial ALD 提速</text>
  </g>
</svg>
