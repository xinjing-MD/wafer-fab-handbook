<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Title -->
  <text x="480" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">逻辑晶体管结构四代演进：Planar → FinFET → GAA Nanosheet → CFET + BSPDN</text>
  <text x="480" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">Electrostatic Gate Control Evolution &amp; Backside Power Delivery Network Architecture</text>

  <!-- Panel 1: Planar -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="215" height="370" rx="8" fill="#1e293b" stroke="#64748b" />
    <text x="107" y="24" fill="#cbd5e1" font-size="12" font-weight="bold" text-anchor="middle">1. Planar MOSFET (≥28nm)</text>
    <text x="107" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">单面平面栅控</text>
    <!-- Substrate -->
    <rect x="30" y="140" width="155" height="75" fill="#334155" />
    <!-- Channel -->
    <rect x="75" y="140" width="65" height="14" fill="#38bdf8" />
    <!-- Gate Ox & Gate -->
    <rect x="75" y="133" width="65" height="7" fill="#10b981" />
    <rect x="75" y="100" width="65" height="33" fill="#f59e0b" />
    <text x="107" y="121" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">Gate 栅极</text>
    <text x="107" y="151" fill="#0f172a" font-size="8" font-weight="bold" text-anchor="middle">沟道</text>
    <text x="107" y="185" fill="#f87171" font-size="9" text-anchor="middle">↓↓↓ 漏电绕过底部 ↓↓↓</text>
    <rect x="15" y="235" width="185" height="120" rx="6" fill="#0f172a" />
    <text x="25" y="255" fill="#cbd5e1" font-size="9">• 栅极仅从上方 1 面压控沟道</text>
    <text x="25" y="273" fill="#f87171" font-size="9">• 20nm 以下 DIBL/SS 失控</text>
    <text x="25" y="291" fill="#94a3b8" font-size="8">• 28nm 引入 HKMG 后到达物理极限</text>
  </g>

  <!-- Panel 2: FinFET -->
  <g transform="translate(255, 75)">
    <rect x="0" y="0" width="215" height="370" rx="8" fill="#1e293b" stroke="#38bdf8" />
    <text x="107" y="24" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">2. FinFET 立体鳍式 (16~3nm)</text>
    <text x="107" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">三面包裹栅控 (Tri-Gate)</text>
    <!-- Substrate + STI -->
    <rect x="30" y="185" width="155" height="30" fill="#334155" />
    <rect x="30" y="155" width="55" height="30" fill="#475569" />
    <rect x="130" y="155" width="55" height="30" fill="#475569" />
    <!-- Gate wrapping 3 sides of Fin -->
    <polygon points="75,95 140,95 140,155 122,155 122,115 93,115 93,155 75,155" fill="#f59e0b" />
    <!-- Fin Channel -->
    <rect x="97" y="119" width="21" height="66" fill="#38bdf8" />
    <text x="107" y="109" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">Gate</text>
    <text x="107" y="148" fill="#0f172a" font-size="8" font-weight="bold" text-anchor="middle">Fin</text>
    <text x="58" y="173" fill="#cbd5e1" font-size="8" text-anchor="middle">STI</text>
    <rect x="15" y="235" width="185" height="120" rx="6" fill="#0f172a" />
    <text x="25" y="255" fill="#34d399" font-size="9">• 三面包覆，抑制短沟道效应</text>
    <text x="25" y="273" fill="#cbd5e1" font-size="9">• 依赖 SAQP 切出超高深宽比 Fin</text>
    <text x="25" y="291" fill="#f87171" font-size="8">• 局限：有效宽度量子化（按根数算）</text>
    <text x="25" y="307" fill="#f87171" font-size="8">  3nm 下 Fin 底部依然漏电</text>
  </g>

  <!-- Panel 3: GAA Nanosheet -->
  <g transform="translate(485, 75)">
    <rect x="0" y="0" width="215" height="370" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="107" y="24" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">3. GAA Nanosheet (3nm/2nm)</text>
    <text x="107" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">四面全环绕垂直堆叠</text>
    <!-- Substrate -->
    <rect x="30" y="195" width="155" height="20" fill="#334155" />
    <!-- Gate surrounding nanosheets -->
    <rect x="55" y="92" width="105" height="103" rx="4" fill="#f59e0b" />
    <!-- 3 Stacked Silicon Nanosheets wrapped in HfO2 -->
    <rect x="70" y="106" width="75" height="14" rx="2" fill="#38bdf8" stroke="#10b981" stroke-width="2" />
    <rect x="70" y="135" width="75" height="14" rx="2" fill="#38bdf8" stroke="#10b981" stroke-width="2" />
    <rect x="70" y="164" width="75" height="14" rx="2" fill="#38bdf8" stroke="#10b981" stroke-width="2" />
    <text x="107" y="116" fill="#0f172a" font-size="8" font-weight="bold" text-anchor="middle">Si 纳米片 3</text>
    <text x="107" y="145" fill="#0f172a" font-size="8" font-weight="bold" text-anchor="middle">Si 纳米片 2</text>
    <text x="107" y="174" fill="#0f172a" font-size="8" font-weight="bold" text-anchor="middle">Si 纳米片 1</text>
    <rect x="15" y="235" width="185" height="120" rx="6" fill="#0f172a" />
    <text x="25" y="255" fill="#34d399" font-size="9">• 四面全包，SS 逼近 ~63 mV/dec</text>
    <text x="25" y="273" fill="#cbd5e1" font-size="9">• 连续调节纳米片宽度优化 PPA</text>
    <text x="25" y="291" fill="#fef08a" font-size="8">• 核心难点：Si/SiGe 超晶格外延 +</text>
    <text x="25" y="307" fill="#fef08a" font-size="8">  内侧墙 + ALE 选择性释放通道</text>
  </g>

  <!-- Panel 4: CFET + BSPDN -->
  <g transform="translate(715, 75)">
    <rect x="0" y="0" width="220" height="370" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="110" y="24" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">4. CFET + 背面供电 (≤1.4nm)</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">P/N 垂直叠放 + 正反双面走线</text>
    <!-- Frontside Signal Routing -->
    <rect x="45" y="55" width="130" height="22" rx="3" fill="#0284c7" />
    <text x="110" y="70" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">正面：纯高速信号互连 BEOL</text>
    <!-- Top Device (e.g. PMOS) -->
    <rect x="65" y="85" width="90" height="40" rx="3" fill="#f59e0b" />
    <rect x="77" y="94" width="66" height="8" fill="#f43f5e" />
    <rect x="77" y="108" width="66" height="8" fill="#f43f5e" />
    <text x="175" y="108" fill="#fda4af" font-size="8">顶层 P</text>
    <!-- Middle Isolation -->
    <rect x="65" y="128" width="90" height="10" fill="#64748b" />
    <text x="175" y="136" fill="#94a3b8" font-size="8">介质隔离</text>
    <!-- Bottom Device (NMOS) -->
    <rect x="65" y="141" width="90" height="40" rx="3" fill="#f59e0b" />
    <rect x="77" y="150" width="66" height="8" fill="#38bdf8" />
    <rect x="77" y="164" width="66" height="8" fill="#38bdf8" />
    <text x="175" y="164" fill="#93c5fd" font-size="8">底层 N</text>
    <!-- Nano-TSV -->
    <rect x="103" y="181" width="14" height="16" fill="#fbbf24" />
    <text x="148" y="192" fill="#fde047" font-size="8">nTSV</text>
    <!-- Backside Power Rail -->
    <rect x="45" y="197" width="130" height="22" rx="3" fill="#b45309" stroke="#fbbf24" />
    <text x="110" y="212" fill="#fef08a" font-size="9" font-weight="bold" text-anchor="middle">背面供电网络 BSPDN (低IR压降)</text>

    <rect x="15" y="235" width="190" height="120" rx="6" fill="#0f172a" />
    <text x="25" y="255" fill="#c084fc" font-size="9">• N/P 垂直堆叠再缩 ~45% 面积</text>
    <text x="25" y="273" fill="#cbd5e1" font-size="9">• 背面宽厚铜线供电，压降降 30%</text>
    <text x="25" y="291" fill="#f87171" font-size="8">• 代价：需 W2W 键合+减薄至数百</text>
    <text x="25" y="307" fill="#f87171" font-size="8">  纳米+极高深宽比双层金属接触</text>
  </g>
</svg>
